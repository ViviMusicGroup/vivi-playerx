name: Update Player Configurations

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:      # Allows manual trigger
    inputs:
      player_hashes:
        description: 'Space-separated list of custom player hashes to extract (e.g. 3241c7eb)'
        required: false
        default: ''

permissions:
  contents: write         # Required to push updates back to the repository

jobs:
  update-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run extractor script
        run: |
          if [ -n "${{ github.event.inputs.player_hashes }}" ]; then
            python extract_cipher.py ${{ github.event.inputs.player_hashes }}
          else
            python extract_cipher.py
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add player_configs.json
          git diff-index --quiet HEAD || git commit -m "auto: update player configs"
          git push
